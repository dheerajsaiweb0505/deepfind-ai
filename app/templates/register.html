{% extends "layouts/auth.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h2>Create Account</h2>

<form id="register-form">

    <input
        type="text"
        id="username"
        placeholder="Username"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<p>
Already have an account?

<a href="/login">

Login

</a>

</p>

<div id="message"></div>

{% endblock %}
