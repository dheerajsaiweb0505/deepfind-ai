{% extends "layouts/auth.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h2>Welcome Back</h2>

<form id="login-form">

<input
type="email"
id="email"
placeholder="Email"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button>

Login

</button>

</form>

<p>

Don't have an account?

<a href="/register">

Register

</a>

</p>

<div id="message"></div>

{% endblock %}
